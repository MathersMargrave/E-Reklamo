<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Community Complaint </title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>

    <section id="home" class="hero">
        <div>
            <h1>Digi-CoCo</h1>
            <p>
                Report community problems from <strong> New Lower Bicutan </strong> easily and help make
                our neighborhood safer and better.
            </p>
            <a href="#complaint" class="btn">Submit a Complaint</a>
        </div>
    </section>

    <section id="complaint" class="section">
        <h2>Submit a Complaint</h2>

        <p class="subtitle">Please provide the details of your complaint.</p>

        <form id="complaintForm">

            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Enter your name" required>

            <label for="Contact">Contact Number</label>
            <input type="tel" id="Contact" pattern="09 [0-9] {9}" placeholder="e.g 09XXXXXXXXX" maxlength="11"  required>
            
            <label for="category">Complaint Category</label>
            <select id="category" required>
                <option value="">Select Category</option>
                <option value="Noise">Noise</option>
                <option value="Garbage">Garbage</option>
                <option value="Illegal Parking">Illegal Parking</option>
            </select>

            <label for="location">Location</label>
            <input type="text" id="location" placeholder="Where did it happen?" required>
            <label for="Evidence">Evidence</label>
            <input type="file" placeholder="Evidence ng kalokohan" required>

            <label for="description">Complaint Description</label>
            <textarea id="description" rows="5"
                placeholder="Describe your complaint..." required></textarea>

            <button type="submit">Submit Complaint</button>

        </form>
    </section>
</body>
</html>
